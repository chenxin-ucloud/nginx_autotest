[nginx]
nginx_path = /etc/nginx/nginx.conf
nginx_bin_path = /usr/sbin/nginx
backup_path = /tmp/nginx_backup/
error_log_path = /var/log/nginx/error.log

[test_env]
localhost = 127.0.0.1
grpc_port = 8080
python_server_port = 8000
nginx_default_port = 80

[report]
report_path = reports/
report_name = report.html
