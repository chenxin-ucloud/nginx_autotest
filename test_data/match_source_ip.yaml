# match_source_ip源IP匹配测试数据

match_ip_001:
  test_purpose: 验证match_source_ip精确IP匹配(127.0.0.1)
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_exact_ip {
        match_source_ip 127.0.0.1;
        return 200 "exact_ip_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s http://127.0.0.1:18100/"
  expected_result:
    - "test is successful"
    - "exact_ip_matched"

match_ip_002:
  test_purpose: 验证match_source_ip CIDR网段匹配(127.0.0.0/8)
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_cidr {
        match_source_ip 127.0.0.0/8;
        return 200 "cidr_ip_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s http://127.0.0.1:18100/"
  expected_result:
    - "test is successful"
    - "cidr_ip_matched"

match_ip_003:
  test_purpose: 验证match_source_ip不匹配时回退到兜底规则
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_other_ip {
        match_source_ip 1.1.1.1 2.2.2.2;
        return 200 "other_ip_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s http://127.0.0.1:18100/"
  expected_result:
    - "test is successful"
    - "no_match"
  unexpected_result:
    - "other_ip_matched"
