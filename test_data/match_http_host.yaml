# match_http_host域名匹配测试数据

match_host_001:
  test_purpose: 验证match_http_host精确匹配
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_exact {
        match_http_host www.test.com;
        return 200 "exact_host_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -H \"Host: www.test.com\" http://127.0.0.1:18100/"
  expected_result:
    - "test is successful"
    - "exact_host_matched"

match_host_002:
  test_purpose: 验证match_http_host前缀通配符匹配(*.example.com)
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_wildcard {
        match_http_host *.example.com;
        return 200 "wildcard_prefix_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -H \"Host: sub.example.com\" http://127.0.0.1:18100/"
  expected_result:
    - "test is successful"
    - "wildcard_prefix_matched"

match_host_003:
  test_purpose: 验证match_http_host后缀通配符匹配(www.example.*)
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_suffix {
        match_http_host www.example.*;
        return 200 "wildcard_suffix_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -H \"Host: www.example.org\" http://127.0.0.1:18100/"
  expected_result:
    - "test is successful"
    - "wildcard_suffix_matched"

match_host_004:
  test_purpose: 验证match_http_host正则匹配
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_regex {
        match_http_host ~^www\d+\.test\.com$;
        return 200 "regex_host_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -H \"Host: www123.test.com\" http://127.0.0.1:18100/"
  expected_result:
    - "test is successful"
    - "regex_host_matched"

match_host_005:
  test_purpose: 验证match_http_host多值OR关系(任一匹配即成功)
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_multi {
        match_http_host www.first.com www.second.com;
        return 200 "multi_host_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -H \"Host: www.first.com\" http://127.0.0.1:18100/"
    - "curl -s -H \"Host: www.second.com\" http://127.0.0.1:18100/"
    - "curl -s -H \"Host: www.third.com\" http://127.0.0.1:18100/"
  expected_result:
    - "test is successful"
    - "multi_host_matched"
    - "no_match"
