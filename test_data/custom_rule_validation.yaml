# 自定义规则语法校验/边界用例
# 覆盖：重复配置校验、multi_condition off+条件报错、内置头保护、无效状态码范围
# 均为 expect_syntax_fail 类型

valid_001:
  test_purpose: 验证match_http_host重复配置报"is duplicate"错误
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /a {
        match_http_host a.com;
        match_http_host b.com;
        return 200 "ok";
      }
    }
  operate_commands:
    - "nginx -t"
  expect_syntax_fail: true
  expected_result:
    - "is duplicate"
    - "test failed"

valid_002:
  test_purpose: 验证match_http_status重复配置报"is duplicate"错误
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18101;
      location / { return 200 "ok"; }
    }
    server {
      listen 18100;
      location /p { proxy_pass http://127.0.0.1:18101; }
      response_rule r {
        match_http_status 200;
        match_http_status 404;
      }
    }
  operate_commands:
    - "nginx -t"
  expect_syntax_fail: true
  expected_result:
    - "is duplicate"
    - "test failed"

valid_003:
  test_purpose: 验证multi_condition关闭时配置match指令报错
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    server {
      listen 18100;
      location /a {
        match_http_host a.com;
        return 200 "ok";
      }
    }
  operate_commands:
    - "nginx -t"
  expect_syntax_fail: true
  expected_result:
    - "multi_condition is false"
    - "test failed"

valid_004:
  test_purpose: 验证response_add_http_header使用内置保护头(Server)报错
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18101;
      location / { return 200 "ok"; }
    }
    server {
      listen 18100;
      location /p { proxy_pass http://127.0.0.1:18101; }
      response_rule r {
        response_add_http_header Server hacked;
      }
    }
  operate_commands:
    - "nginx -t"
  expect_syntax_fail: true
  expected_result:
    - "builtin response header"
    - "test failed"

valid_005:
  test_purpose: 验证match_http_status无效范围(start>end)报错
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18101;
      location / { return 200 "ok"; }
    }
    server {
      listen 18100;
      location /p { proxy_pass http://127.0.0.1:18101; }
      response_rule r {
        match_http_status 500-200;
      }
    }
  operate_commands:
    - "nginx -t"
  expect_syntax_fail: true
  expected_result:
    - "invalid range"
    - "test failed"
