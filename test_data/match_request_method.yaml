# match_request_method请求方法匹配测试数据

match_method_001:
  test_purpose: 验证match_request_method单方法匹配(GET)
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_get {
        match_request_method GET;
        return 200 "get_method_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s http://127.0.0.1:18100/"
  expected_result:
    - "test is successful"
    - "get_method_matched"

match_method_002:
  test_purpose: 验证match_request_method多方法OR关系(GET POST)
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_multi {
        match_request_method GET POST;
        return 200 "multi_method_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -X POST http://127.0.0.1:18100/"
  expected_result:
    - "test is successful"
    - "multi_method_matched"

match_method_003:
  test_purpose: 验证match_request_method不匹配时回退到兜底规则
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_get_only {
        match_request_method GET;
        return 200 "get_only_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -X DELETE http://127.0.0.1:18100/"
  expected_result:
    - "test is successful"
    - "no_match"
  unexpected_result:
    - "get_only_matched"
