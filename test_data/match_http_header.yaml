# match_http_header请求头匹配测试数据

match_header_001:
  test_purpose: 验证match_http_header精确键值匹配
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_exact {
        match_http_header X-Test-Key test_value;
        return 200 "header_exact_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -H \"X-Test-Key: test_value\" http://127.0.0.1:18100/"
    - "curl -s -H \"X-Test-Key: wrong_value\" http://127.0.0.1:18100/"
  expected_result:
    - "test is successful"
    - "header_exact_matched"
    - "no_match"

match_header_002:
  test_purpose: 验证match_http_header正则值匹配
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_regex {
        match_http_header X-Test-Key ~^val_[0-9]+$;
        return 200 "header_regex_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -H \"X-Test-Key: val_123\" http://127.0.0.1:18100/"
    - "curl -s -H \"X-Test-Key: val_abc\" http://127.0.0.1:18100/"
  expected_result:
    - "test is successful"
    - "header_regex_matched"
    - "no_match"

match_header_003:
  test_purpose: 验证match_http_header单条多KV为OR关系且多条之间为AND关系
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_and_or {
        match_http_header X-Group-A val_a1 X-Group-A2 val_a2;
        match_http_header X-Group-B val_b1;
        return 200 "header_and_or_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -H \"X-Group-A: val_a1\" -H \"X-Group-B: val_b1\" http://127.0.0.1:18100/"
    - "curl -s -H \"X-Group-A: val_a1\" http://127.0.0.1:18100/"
  expected_result:
    - "test is successful"
    - "header_and_or_matched"
    - "no_match"

match_header_004:
  test_purpose: 验证match_http_header仅配置key不配置value时语法检查拒绝
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_key_only {
        match_http_header X-Exists;
        return 200 "header_key_only_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
  expect_syntax_fail: true
  expected_result:
    - "invalid number of arguments"
    - "test failed"
