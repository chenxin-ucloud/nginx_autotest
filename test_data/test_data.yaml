server_name_004:
  test_purpose: 验证匹配优先级-精确匹配优先于通配符和正则
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 80;
      listen [::]:80;
      server_name ~^.+\.example\.com$;
