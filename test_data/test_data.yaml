native_path_fallback_001:
  test_purpose: 验证match条件不命中时回退到原生location path匹配命中第二个location
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /path1 {
        match_http_header X-Key val;
        return 200 "loc1_hit";
      }
      location /path2 {
        match_http_header X-Key val;
        return 200 "loc2_hit";
      }
      location /path3 {
        match_http_header X-Key val;
        return 200 "loc3_hit";
      }
    }
  operate_steps:
    - command: 'curl -s http://127.0.0.1:18100/path2'
      expected:
        - 'loc2_hit'
    - command: 'curl -s -H "X-Key: val" http://127.0.0.1:18100/path2'
      expected:
        - 'loc1_hit'
nocond_first_001:
  test_purpose: 验证第一个location不配置任何匹配条件时优先于第二个全条件location命中
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /catch_all {
        return 200 "loc1_no_cond_hit";
      }
      location /rule_all {
        match_http_host www.test.com;
        match_http_path /rule_all;
        match_http_header X-Auth token;
