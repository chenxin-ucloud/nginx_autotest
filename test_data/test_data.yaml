    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18101;
      location /200 { return 200; }
      location /201 { return 201; }
      location /204 { return 204; }
      location /206 { return 206; }
      location /301 { return 301 http://example.com; }
      location /302 { return 302 http://example.com; }
      location /303 { return 303 http://example.com; }
      location /304 { add_header ETag "abc"; return 304; }
      location /307 { return 307 http://example.com; }
      location /308 { return 308 http://example.com; }
    }
    server {
      listen 18100;
      location ~ ^/proxy/(.*)$ { proxy_pass http://127.0.0.1:18101/$1; }
      response_rule safe_all {
        response_add_http_header X-Safe-Code added;
      }
    }
  operate_steps:
