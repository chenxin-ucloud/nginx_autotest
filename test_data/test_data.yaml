edge_001:
  test_purpose: 验证match_source_ip IPv6地址(::1)匹配
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      listen [::]:18100;
      location /rule_ipv6 {
        match_source_ip ::1;
        return 200 "ipv6_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_steps:
    - command: 'curl -s http://[::1]:18100/'
      expected:
        - 'ipv6_matched'
    - command: 'curl -s http://127.0.0.1:18100/'
      expected:
        - 'no_match'
edge_002:
