  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 80;
      listen [::]:80;
      server_name www.example.*;
      location / {
        return 200 "Suffix Wildcard Hit";
      }
    }
    server {
      listen 80;
      listen [::]:80;
      server_name *.example.com;
      location / {
        return 200 "Prefix Wildcard Hit";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -H \"Host: www.example.com\" http://localhost/"
  expected_result:
    - "test is successful"
