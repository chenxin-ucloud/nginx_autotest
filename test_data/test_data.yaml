  config_content: |
    server {
      listen 80;
      listen [::]:80;
      server_name *.example.com;
      location / {
        return 200 "Wildcard Match";
      }
    }
  operate_steps:
    - command: 'curl -H "Host: sub.example.com" http://localhost/'
      expected:
        - 'Wildcard Match'
server_name_003:
  test_purpose: 验证基础功能-正则匹配server_name
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 80;
      listen [::]:80;
      server_name ~^www\d+\.example\.com$;
      location / {
        return 200 "Regex Match";
      }
    }
  operate_steps:
    - command: 'curl -H "Host: www123.example.com" http://localhost/'
      expected:
        - 'Regex Match'
server_name_004:
  test_purpose: 验证匹配优先级-精确匹配优先于通配符和正则
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 80;
      listen [::]:80;
      server_name ~^.+\.example\.com$;
      location / {
        return 200 "Regex Hit";
      }
    }
    server {
      listen 80;
      listen [::]:80;
      server_name *.example.com;
      location / {
        return 200 "Wildcard Hit";
      }
    }
    server {
      listen 80;
      listen [::]:80;
      server_name priority.example.com;
      location / {
        return 200 "Exact Hit";
      }
    }
  operate_steps:
    - command: 'curl -H "Host: priority.example.com" http://localhost/'
      expected:
        - 'Exact Hit'
      unexpected:
        - 'Wildcard Hit'
        - 'Regex Hit'
server_name_005:
  test_purpose: 验证匹配优先级-前缀通配符(*.x)优先于正则匹配
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 80;
      listen [::]:80;
      server_name ~^.+\.example\.com$;
      location / {
        return 200 "Regex Hit";
      }
    }
    server {
      listen 80;
      listen [::]:80;
      server_name *.example.com;
      location / {
        return 200 "Wildcard Hit";
      }
    }
  operate_steps:
    - command: 'curl -H "Host: any.example.com" http://localhost/'
      expected:
        - 'Wildcard Hit'
      unexpected:
        - 'Regex Hit'
server_name_006:
  test_purpose: 验证匹配优先级-前缀通配符(*.x)优先于后缀通配符(x.*)
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 80;
      listen [::]:80;
      server_name www.example.*;
      location / {
        return 200 "Suffix Wildcard Hit";
      }
    }
    server {
      listen 80;
      listen [::]:80;
      server_name *.example.com;
      location / {
        return 200 "Prefix Wildcard Hit";
      }
    }
  operate_steps:
    - command: 'curl -H "Host: www.example.com" http://localhost/'
      expected:
        - 'Prefix Wildcard Hit'
      unexpected:
        - 'Suffix Wildcard Hit'
server_name_007:
  test_purpose: 验证匹配优先级-正则按配置顺序匹配第一个
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 80;
      listen [::]:80;
      server_name ~^www\d+\.example\.com$;
      location / {
        return 200 "First Regex Hit";
      }
    }
    server {
      listen 80;
      listen [::]:80;
      server_name ~^www.+\.example\.com$;
      location / {
        return 200 "Second Regex Hit";
      }
    }
  operate_steps:
    - command: 'curl -H "Host: www123.example.com" http://localhost/'
      expected:
        - 'First Regex Hit'
      unexpected:
        - 'Second Regex Hit'
server_name_008:
  test_purpose: 验证匹配优先级-未匹配任何server_name时由default_server处理
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 80;
      listen [::]:80;
      server_name specific.example.com;
      location / {
        return 200 "Specific Hit";
      }
    }
    server {
      listen 80 default_server;
      listen [::]:80 default_server;
      server_name _;
      location / {
        return 200 "Default Server Hit";
      }
    }
  operate_steps:
    - command: 'curl -H "Host: nomatch.other.com" http://localhost/'
      expected:
        - 'Default Server Hit'
      unexpected:
        - 'Specific Hit'
proxy_set_header_001:
  test_purpose: 验证基础功能-添加自定义请求头
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    location /test_add_header {
      proxy_pass http://127.0.0.1:19999;
      proxy_set_header X-Test-Header "test123";
    }
  operate_steps:
    - command: 'curl -v http://localhost/test_add_header'
proxy_set_header_002:
  test_purpose: 验证基础功能-修改Host请求头
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    location /test_modify_host {
      proxy_pass http://127.0.0.1:19999;
      proxy_set_header Host "modified.host.com";
    }
  operate_steps:
    - command: 'curl -v -H "Host: original.host.com" http://localhost/test_modify_host'
proxy_pass_header_001:
  test_purpose: 验证基础功能-传递自定义响应头
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - 后端服务可访问
  config_content: |
    location /test_pass_header {
      proxy_pass http://127.0.0.1:19999;
      proxy_pass_header X-Custom-Response;
    }
  operate_steps:
    - command: 'curl -v http://localhost/test_pass_header'
proxy_hide_header_001:
  test_purpose: 验证基础功能-隐藏单个自定义响应头
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    server {
      listen 18081;
      server_name localhost;
      location / {
        add_header X-Secret-Info "sensitive_data";
        add_header X-Public-Info "public_data";
        return 200 "upstream ok";
      }
    }
    server {
      listen 18080;
      server_name localhost;
      location /test_hide_single {
        proxy_pass http://127.0.0.1:18081/;
        proxy_hide_header X-Secret-Info;
      }
    }
  operate_steps:
    - command: 'curl -v http://localhost:18080/test_hide_single'
      expected:
        - 'upstream ok'
        - 'X-Public-Info: public_data'
      unexpected:
        - 'X-Secret-Info'
multi_condition_001:
  test_purpose: 验证multi_condition关闭时原生location匹配正常工作
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    server {
      listen 18100;
      location = /exact {
        return 200 "exact_match";
      }
      location / {
        return 200 "default_match";
      }
    }
  operate_steps:
    - command: 'curl -s http://127.0.0.1:18100/exact'
      expected:
        - 'exact_match'
      unexpected:
        - 'default_match'
multi_condition_002:
  test_purpose: 验证multi_condition开启后自定义规则匹配生效
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_host {
        match_http_host www.test.com;
        return 200 "host_rule_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_steps:
    - command: 'curl -s http://www.test.com:18100/anything'
      expected:
        - 'host_rule_matched'
    - command: 'curl -s http://other.com:18100/anything'
      expected:
        - 'no_match'
