server_name_007:
  test_purpose: 验证匹配优先级-正则按配置顺序匹配第一个
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 80;
      listen [::]:80;
      server_name ~^www\d+\.example\.com$;
      location / {
        return 200 "First Regex Hit";
      }
    }
    server {
      listen 80;
      listen [::]:80;
      server_name ~^www.+\.example\.com$;
      location / {
        return 200 "Second Regex Hit";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -H \"Host: www123.example.com\" http://localhost/"
  expected_result:
    - "test is successful"
    - "First Regex Hit"
  unexpected_result:
    - "Second Regex Hit"

server_name_008:
  test_purpose: 验证匹配优先级-未匹配任何server_name时由default_server处理
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 80;
      listen [::]:80;
      server_name specific.example.com;
      location / {
        return 200 "Specific Hit";
      }
    }
    server {
      listen 80 default_server;
      listen [::]:80 default_server;
      server_name _;
      location / {
        return 200 "Default Server Hit";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -H \"Host: nomatch.other.com\" http://localhost/"
  expected_result:
    - "test is successful"
    - "Default Server Hit"
  unexpected_result:
    - "Specific Hit"


