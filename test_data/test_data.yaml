    - command: 'curl -s -v http://127.0.0.1:18100/proxy/201 2>&1'
      expected:
        - 'X-Safe-Code'
        - 'added'
    - command: 'curl -s -v http://127.0.0.1:18100/proxy/204 2>&1'
      expected:
        - 'X-Safe-Code'
        - 'added'
    - command: 'curl -s -v http://127.0.0.1:18100/proxy/206 2>&1'
      expected:
        - 'X-Safe-Code'
        - 'added'
    - command: 'curl -s -v http://127.0.0.1:18100/proxy/301 2>&1'
      expected:
        - 'X-Safe-Code'
        - 'added'
    - command: 'curl -s -v http://127.0.0.1:18100/proxy/302 2>&1'
      expected:
        - 'X-Safe-Code'
        - 'added'
    - command: 'curl -s -v http://127.0.0.1:18100/proxy/303 2>&1'
      expected:
        - 'X-Safe-Code'
        - 'added'
    - command: 'curl -s -v http://127.0.0.1:18100/proxy/304 2>&1'
      expected:
