      listen 18100;
      location /rule_urlenc_cookie {
        match_query_string name hello@world;
        match_cookie c1 v1;
        match_cookie c2 v2;
        return 200 "urlenc_cookie_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_steps:
    - command: 'curl -s -b "c1=v1; c2=v2" "http://127.0.0.1:18100/rule_urlenc_cookie?name=hello%40world"'
      expected:
        - 'urlenc_cookie_matched'
    - command: 'curl -s -b "c1=v1" "http://127.0.0.1:18100/rule_urlenc_cookie?name=hello%40world"'
      expected:
        - 'no_match'
