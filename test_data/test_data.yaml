
# ============================================================
# 回归用例 - add_header
# ============================================================

add_header_001:
  test_purpose: 验证基础功能-添加自定义响应头
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 18090;
      server_name localhost;
      location /test_add_response_header {
        add_header X-Custom-Response "custom_value";
        return 200 "OK";
      }
    }
  operate_steps:
    - command: 'curl -v http://localhost:18090/test_add_response_header'
      expected:
        - 'X-Custom-Response: custom_value'
location_001:
  test_purpose: 验证基础功能-精确匹配location
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 18090;
      server_name localhost;
      location = /exact {
        return 200 "Exact Location";
      }
    }
  operate_steps:
    - command: 'curl http://localhost:18090/exact'
      expected:
        - 'Exact Location'
location_002:
  test_purpose: 验证基础功能-前缀匹配location
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 18090;
      server_name localhost;
      location /prefix {
        return 200 "Prefix Match";
      }
    }
  operate_steps:
    - command: 'curl http://localhost:18090/prefix/path'
      expected:
        - 'Prefix Match'
location_003:
  test_purpose: 验证基础功能-正则匹配location
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 18090;
      server_name localhost;
      location ~ \.(gif|jpg|png)$ {
        return 200 "Image Regex Match";
      }
    }
  operate_steps:
    - command: 'curl http://localhost:18090/test.png'
      expected:
        - 'Image Regex Match'
location_004:
  test_purpose: 验证基础功能-不区分大小写正则匹配
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 18090;
      server_name localhost;
      location ~* \.(jpg|jpeg|png|gif)$ {
        return 200 "Case Insensitive Regex";
      }
    }
  operate_steps:
    - command: 'curl http://localhost:18090/test.JPG'
      expected:
        - 'Case Insensitive Regex'
location_005:
  test_purpose: 验证基础功能-优先匹配location ^~
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 18090;
      server_name localhost;
      location ^~ /static {
        return 200 "Prefix Priority Match";
      }
    }
  operate_steps:
    - command: 'curl http://localhost:18090/static/file.txt'
      expected:
        - 'Prefix Priority Match'
location_006:
  test_purpose: 验证匹配优先级-精确匹配(=)优先于正则和前缀匹配
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 18090;
      server_name localhost;
      location / {
        return 200 "General Prefix Hit";
      }
      location ~* ^/api {
        return 200 "Regex Hit";
      }
      location = /api/exact {
        return 200 "Exact Hit";
      }
    }
  operate_steps:
    - command: 'curl http://localhost:18090/api/exact'
      expected:
        - 'Exact Hit'
      unexpected:
        - 'Regex Hit'
        - 'General Prefix Hit'
location_007:
  test_purpose: 验证匹配优先级-^~前缀匹配优先于正则匹配
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 18090;
      server_name localhost;
      location / {
        return 200 "General Prefix Hit";
      }
      location ~* \.html$ {
        return 200 "Regex Hit";
      }
      location ^~ /static/ {
        return 200 "Priority Prefix Hit";
      }
    }
  operate_steps:
    - command: 'curl http://localhost:18090/static/page.html'
      expected:
        - 'Priority Prefix Hit'
      unexpected:
        - 'Regex Hit'
        - 'General Prefix Hit'
location_008:
  test_purpose: 验证匹配优先级-正则匹配优先于普通前缀匹配
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 18090;
      server_name localhost;
      location / {
        return 200 "General Prefix Hit";
      }
      location /images/ {
        return 200 "Prefix Hit";
      }
      location ~* \.(png|jpg|gif)$ {
        return 200 "Regex Hit";
      }
    }
  operate_steps:
    - command: 'curl http://localhost:18090/images/logo.png'
      expected:
        - 'Regex Hit'
      unexpected:
        - 'Prefix Hit'
        - 'General Prefix Hit'
location_009:
  test_purpose: 验证匹配优先级-普通前缀匹配优先于通用/匹配
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 18090;
      server_name localhost;
      location / {
        return 200 "General Prefix Hit";
      }
      location /api/ {
        return 200 "Prefix Hit";
      }
    }
  operate_steps:
    - command: 'curl http://localhost:18090/api/users'
      expected:
        - 'Prefix Hit'
      unexpected:
        - 'General Prefix Hit'
location_010:
  test_purpose: 验证匹配优先级-全部共存时完整优先级链(= > ^~ > 正则 > 普通前缀 > /)
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 18090;
      server_name localhost;
      location / {
        return 200 "General Prefix Hit";
      }
      location /app {
        return 200 "Prefix Hit";
      }
      location ~* ^/app {
        return 200 "Regex Hit";
      }
      location ^~ /app/static {
        return 200 "Priority Prefix Hit";
      }
      location = /app/static/main.js {
        return 200 "Exact Hit";
      }
    }
  operate_steps:
    - command: 'curl http://localhost:18090/app/static/main.js'
      expected:
        - 'Exact Hit'
    - command: 'curl http://localhost:18090/app/static/other.js'
      expected:
        - 'Priority Prefix Hit'
    - command: 'curl http://localhost:18090/app/page'
      expected:
        - 'Regex Hit'
    - command: 'curl http://localhost:18090/other'
      expected:
        - 'General Prefix Hit'
server_name_001:
  test_purpose: 验证基础功能-精确匹配server_name
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - hosts配置正确
  config_content: |
    server {
      listen 80;
      listen [::]:80;
      server_name exact.example.com;
      location / {
        return 200 "Exact Match";
      }
    }
  operate_steps:
    - command: 'curl -H "Host: exact.example.com" http://localhost/'
      expected:
        - 'Exact Match'
server_name_002:
  test_purpose: 验证基础功能-通配符匹配server_name
  pre_condition:
