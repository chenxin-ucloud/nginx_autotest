always_nosafe_001:
  test_purpose: 验证response_add_http_header非safe状态码(418)不带always不添加带always添加
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18101;
      location / { return 418; }
    }
    server {
      listen 18100;
      location /proxy_noalways { proxy_pass http://127.0.0.1:18101; }
      location /proxy_always { proxy_pass http://127.0.0.1:18101; }
      response_rule noalways {
        match_http_path /proxy_noalways;
        response_add_http_header X-Nosafe-418 added_418;
      }
      response_rule withalways {
        match_http_path /proxy_always;
        response_add_http_header X-Always-418 added_418_always always;
      }
    }
  operate_steps:
    - command: 'curl -s -v http://127.0.0.1:18100/proxy_noalways 2>&1'
      expected:
        - '418'
      unexpected:
        - 'X-Nosafe-418'
    - command: 'curl -s -v http://127.0.0.1:18100/proxy_always 2>&1'
      expected:
        - '418'
        - 'X-Always-418'
        - 'added_418_always'
      unexpected:
        - 'X-Nosafe-418'
