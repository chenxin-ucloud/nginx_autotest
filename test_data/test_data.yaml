    - Nginx配置文件路径已知
    - 已备份原始配置文件
  config_content: |
    server {
      listen 18090;
      server_name localhost;
      location / {
        return 200 "General Prefix Hit";
      }
      location ~* ^/api {
        return 200 "Regex Hit";
      }
      location = /api/exact {
        return 200 "Exact Hit";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl http://localhost:18090/api/exact"
  expected_result:
