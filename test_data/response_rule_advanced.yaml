# response_rule响应方向高级用例
# 覆盖：match_response_http_header、$custom_rule_response_rule_name变量、
#       response_rule内请求条件、always标志、safe_status机制、
#       complex_value变量、match_http_status多值OR、add_header交叉配置

resp_adv_001:
  test_purpose: 验证match_response_http_header精确匹配上游响应头
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18101;
      location / {
        add_header X-Upstream-Header backend_value;
        return 200 "upstream_ok";
      }
    }
    server {
      listen 18100;
      location /proxy {
        proxy_pass http://127.0.0.1:18101;
      }
      response_rule match_resp_hdr_exact {
        match_response_http_header X-Upstream-Header backend_value;
        response_add_http_header X-Resp-Matched yes;
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -v http://127.0.0.1:18100/proxy 2>&1"
  expected_result:
    - "test is successful"
    - "X-Resp-Matched"
    - "yes"

resp_adv_002:
