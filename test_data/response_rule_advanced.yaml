    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18101;
      location / {
        return 404 "not_found";
      }
    }
    server {
      listen 18100;
      location /proxy {
        proxy_pass http://127.0.0.1:18101;
      }
      response_rule always_rule {
        response_add_http_header X-Always-Header added_with_always always;
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -v http://127.0.0.1:18100/proxy 2>&1"
