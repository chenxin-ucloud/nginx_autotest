        response_add_http_header X-Resp-Matched yes;
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -v http://127.0.0.1:18100/proxy 2>&1"
  expected_result:
    - "test is successful"
    - "X-Resp-Matched"
    - "yes"

