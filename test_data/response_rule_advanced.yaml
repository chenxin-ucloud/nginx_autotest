resp_adv_008:
  test_purpose: 验证match_http_status多值OR关系(单状态码+范围混合)
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18101;
      location /200 { return 200 "ok200"; }
      location /404 { return 404 "ok404"; }
      location /500 { return 500 "ok500"; }
    }
    server {
      listen 18100;
      location ~ ^/proxy/(.*)$ { proxy_pass http://127.0.0.1:18101/$1; }
      response_rule multi_status_rule {
        match_http_status 200 404 500-502;
        response_add_http_header X-Status-Matched yes always;
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -v http://127.0.0.1:18100/proxy/200 2>&1"
    - "curl -s -v http://127.0.0.1:18100/proxy/404 2>&1"
    - "curl -s -v http://127.0.0.1:18100/proxy/500 2>&1"
  expected_result:
    - "test is successful"
    - "X-Status-Matched"
    - "yes"

resp_adv_009:
  test_purpose: 验证add_header与response_add_http_header/response_delete_http_header交叉配置共存
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18101;
      location / {
        add_header X-Upstream "from_backend";
        return 200 "upstream_ok";
      }
    }
    server {
      listen 18100;
      location /proxy {
        proxy_pass http://127.0.0.1:18101;
        add_header X-Native-Add native_value;
      }
      response_rule cross_rule {
        response_add_http_header X-Rule-Add rule_value;
        response_delete_http_header X-Upstream;
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -v http://127.0.0.1:18100/proxy 2>&1"
  expected_result:
    - "test is successful"
    - "X-Native-Add"
    - "native_value"
    - "X-Rule-Add"
    - "rule_value"
  unexpected_result:
    - "from_backend"
