resp_adv_004:
  test_purpose: 验证response_rule块内配置match_http_host请求条件(请求条件与响应条件AND)
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18101;
      location / {
        return 200 "upstream_ok";
      }
    }
    server {
      listen 18100;
      location /proxy {
        proxy_pass http://127.0.0.1:18101;
      }
      response_rule req_cond_in_resp {
        match_http_host www.test.com;
        response_add_http_header X-Req-In-Resp matched;
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -v -H \"Host: www.test.com\" http://127.0.0.1:18100/proxy 2>&1"
  expected_result:
    - "test is successful"
    - "X-Req-In-Resp"
    - "matched"
  unexpected_result:
    - "X-Req-In-Resp-Not-Added"

resp_adv_005:
