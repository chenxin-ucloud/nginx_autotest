# 自定义规则边界交叉用例
# 覆盖：IPv6 source_ip匹配、URL编码query值解码+多Cookie AND

edge_001:
  test_purpose: 验证match_source_ip IPv6地址(::1)匹配
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      listen [::]:18100;
      location /rule_ipv6 {
        match_source_ip ::1;
        return 200 "ipv6_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s http://[::1]:18100/"
    - "curl -s http://127.0.0.1:18100/"
  expected_result:
    - "test is successful"
    - "ipv6_matched"
    - "no_match"

edge_002:
  test_purpose: 验证URL编码query值解码后匹配与多Cookie AND关系
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_urlenc_cookie {
        match_query_string name hello@world;
        match_cookie c1 v1;
        match_cookie c2 v2;
        return 200 "urlenc_cookie_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -b \"c1=v1; c2=v2\" \"http://127.0.0.1:18100/rule_urlenc_cookie?name=hello%40world\""
    - "curl -s -b \"c1=v1\" \"http://127.0.0.1:18100/rule_urlenc_cookie?name=hello%40world\""
  expected_result:
    - "test is successful"
    - "urlenc_cookie_matched"
    - "no_match"
