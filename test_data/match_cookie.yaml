# match_cookie Cookie匹配测试数据

match_cookie_001:
  test_purpose: 验证match_cookie精确键值匹配
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_exact {
        match_cookie token abc123;
        return 200 "cookie_exact_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -b \"token=abc123\" http://127.0.0.1:18100/"
    - "curl -s -b \"token=wrong\" http://127.0.0.1:18100/"
  expected_result:
    - "test is successful"
    - "cookie_exact_matched"
    - "no_match"

match_cookie_002:
  test_purpose: 验证match_cookie正则值匹配
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_regex {
        match_cookie session ~^sess_[a-z0-9]+$;
        return 200 "cookie_regex_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -b \"session=sess_abc123\" http://127.0.0.1:18100/"
    - "curl -s -b \"session=invalid\" http://127.0.0.1:18100/"
  expected_result:
    - "test is successful"
    - "cookie_regex_matched"
    - "no_match"

match_cookie_003:
  test_purpose: 验证match_cookie单条多KV为OR关系且多条之间为AND关系
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_and_or {
        match_cookie user_a val_a user_b val_b;
        match_cookie role admin;
        return 200 "cookie_and_or_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -b \"user_a=val_a; role=admin\" http://127.0.0.1:18100/"
    - "curl -s -b \"user_a=val_a\" http://127.0.0.1:18100/"
  expected_result:
    - "test is successful"
    - "cookie_and_or_matched"
    - "no_match"

match_cookie_004:
  test_purpose: 验证match_cookie仅配置key不配置value时语法检查拒绝
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_key_only {
        match_cookie flag;
        return 200 "cookie_key_only_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
  expect_syntax_fail: true
  expected_result:
    - "invalid number of arguments"
    - "test failed"
