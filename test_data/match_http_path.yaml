# match_http_path路径匹配测试数据

match_path_001:
  test_purpose: 验证match_http_path精确匹配(=)
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_exact {
        match_http_path =/exact/path;
        return 200 "exact_path_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s http://127.0.0.1:18100/exact/path"
  expected_result:
    - "test is successful"
    - "exact_path_matched"

