# 请求方向组合条件与变量测试数据

combined_001:
  test_purpose: 验证所有请求条件同时配置的AND关系(全部满足时命中)
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_all {
        match_http_host www.test.com;
        match_http_path /api/test;
        match_http_header X-Auth token123;
        match_cookie session sess_abc;
        match_request_method GET;
        match_query_string version v1;
        return 200 "all_conditions_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -H \"Host: www.test.com\" -H \"X-Auth: token123\" -b \"session=sess_abc\" \"http://127.0.0.1:18100/api/test?version=v1\""
  expected_result:
    - "test is successful"
    - "all_conditions_matched"

combined_002:
  test_purpose: 验证部分条件不匹配时规则不命中(AND关系验证)
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /rule_all {
        match_http_host www.test.com;
        match_http_path /api/test;
        match_http_header X-Auth token123;
        return 200 "all_conditions_matched";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -H \"Host: www.test.com\" -H \"X-Auth: wrong_token\" http://127.0.0.1:18100/api/test"
  expected_result:
    - "test is successful"
    - "no_match"
  unexpected_result:
    - "all_conditions_matched"

combined_003:
  test_purpose: 验证$custom_rule_request_rule_name变量记录命中的请求规则名称
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
  config_content: |
    multi_condition on;
    server {
      listen 18100;
      location /my_named_rule {
        match_http_host www.test.com;
        add_header X-Rule-Name $custom_rule_request_rule_name;
        return 200 "variable_test";
      }
      location /catch_all {
        return 200 "no_match";
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -v -H \"Host: www.test.com\" http://127.0.0.1:18100/ 2>&1"
  expected_result:
    - "test is successful"
    - "variable_test"
    - "X-Rule-Name"
