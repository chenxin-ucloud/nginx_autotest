response_rule_006:
  test_purpose: 验证response_delete_http_header删除上游响应头
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
    - proxy_pass功能正常
  config_content: |
    multi_condition on;
    server {
      listen 18101;
      location / {
        add_header X-To-Delete "should_be_removed";
        add_header X-Keep "should_remain";
        return 200 "upstream_ok";
      }
    }
    server {
      listen 18100;
      location /proxy {
        proxy_pass http://127.0.0.1:18101;
      }
      response_rule delete_header {
        response_delete_http_header X-To-Delete;
      }
    }
  operate_commands:
    - "nginx -t"
    - "nginx -s reload"
    - "curl -s -v http://127.0.0.1:18100/proxy 2>&1"
  expected_result:
    - "test is successful"
    - "X-Keep"
    - "should_remain"
  unexpected_result:
    - "X-To-Delete"
