response_rule_004:
  test_purpose: 验证match_http_status单个状态码匹配
  pre_condition:
    - Nginx配置文件路径已知
    - 已备份原始配置文件
    - Nginx服务已启动
    - proxy_pass功能正常
  config_content: |
    multi_condition on;
    server {
      listen 18101;
      location / {
        return 200 "upstream_ok";
      }
    }
    server {
      listen 18100;
      location /proxy {
        proxy_pass http://127.0.0.1:18101;
